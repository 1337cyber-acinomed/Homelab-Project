services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped

    ports:
      - "80:80"
      - "81:81"
      - "443:443"

    volumes:
      - /srv/docker/data/nginx-proxy-manager/data:/data
      - /srv/docker/data/nginx-proxy-manager/letsencrypt:/etc/letsencrypt

    networks:
      - infrastructure

networks:
  infrastructure:
      external: true
