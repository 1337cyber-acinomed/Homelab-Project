services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:11

    container_name: forgejo

    restart: unless-stopped

    environment:
      USER_UID: 1000
      USER_GID: 1000

    networks:
      - infrastructure

    ports:
      - "3001:3000"
      - "2222:22"

    volumes:
      - /srv/docker/data/forgejo:/data

networks:
  infrastructure:
    external: true
