services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEBSOCKET_ENABLED: "true"

    ports:
      - "3003:80"

    volumes:
      - /srv/docker/data/vaultwarden:/data

    networks:
      - infrastructure

networks:
  infrastructure:
    external: true
